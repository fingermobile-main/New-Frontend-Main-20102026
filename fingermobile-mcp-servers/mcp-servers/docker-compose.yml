version: "3.8"

services:
  mcp-server:
    build: .
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-3001}
      - DB_membername=${DB_membername:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-fingermobile_platform_db}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - JWT_SECRET=${JWT_SECRET:-fingermobile_jwt_secret_32_characters_min}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - fingermobile_network

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_member: ${DB_membername:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-fingermobile_platform_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    restart: unless-stopped
    networks:
      - fingermobile_network

  redis:
    image: redis:6.2-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - fingermobile_network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - mcp-server
    restart: unless-stopped
    networks:
      - fingermobile_network

  new-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.new-mcp-server
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - NEW_MCP_SERVER_PORT=4000
      - NEW_MCP_SERVER_HOST=0.0.0.0
    networks:
      - fingermobile-network
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

networks:
  fingermobile-network:
    driver: bridge
