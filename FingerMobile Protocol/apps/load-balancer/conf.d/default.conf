# FingerMobile Protocol - Load Balancer & API Gateway
# Dynamic Docker DNS Resolver for Microservices Architecture

# HTTP server
server {
    listen 80;
    server_name localhost;
    
    # Internal Docker DNS resolver with 30s TTL
    resolver 127.0.0.11 valid=30s ipv6=off;
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 '{"status":"healthy","timestamp":"$time_iso8601","gateway":"api_gateway"}';
        add_header Content-Type application/json;
    }
    
    # Prefix /auth to /api/auth
    location /auth/ {
        limit_req zone=auth burst=5 nodelay;
        set $backend_svc "http://fingermobile-backend:3000";
        rewrite ^/auth/(.*)$ /api/auth/$1 break;
        proxy_pass $backend_svc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dynamic Microservice Proxies
    location /api/gameon/ {
        limit_req zone=api burst=20 nodelay;
        set $gameon_svc "http://gameon-backend:3001";
        rewrite ^/api/gameon/(.*)$ /api/$1 break;
        proxy_pass $gameon_svc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/fingerlux/ {
        limit_req zone=api burst=20 nodelay;
        set $fingerlux_svc "http://fingerlux-backend:5000";
        rewrite ^/api/fingerlux/(.*)$ /api/$1 break;
        proxy_pass $fingerlux_svc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/fingerwars/ {
        limit_req zone=api burst=20 nodelay;
        set $fingerwars_svc "http://fingerwars-backend:5000";
        rewrite ^/api/fingerwars/(.*)$ /api/$1 break;
        proxy_pass $fingerwars_svc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/trends/ {
