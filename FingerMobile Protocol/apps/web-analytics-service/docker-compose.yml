version: '3.8'

services:
  web-analytics-service-db:
    image: postgres:15-alpine
    container_name: web_analytics_service_db
    environment:
      POSTGRES_DB: web_analytics_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: web_analytics_db_pwd_placeholder
    ports:
      - "5558:5432"
    volumes:
      - web_analytics_service_db_data:/var/lib/postgresql/data
      # - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql # Uncomment and provide schema if available
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - fingermobile_network

  web-analytics-service-redis:
    image: redis:7-alpine
    container_name: web_analytics_service_redis
    command: redis-server --requirepass web_analytics_redis_placeholder
    ports:
      - "6558:6379"
    volumes:
      - web_analytics_service_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "web_analytics_redis_placeholder", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - fingermobile_network

  web-analytics-service-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: web_analytics_service_backend
    environment:
      - NODE_ENV=production
      - PORT=3004
      - DB_HOST=web-analytics-service-db
      - DB_PORT=5432
      - DB_NAME=web_analytics_db
      - DB_USER=postgres
      - DB_PASSWORD=web_analytics_db_pwd_placeholder
      - REDIS_HOST=web-analytics-service-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=web_analytics_redis_placeholder
      - JWT_SECRET=web_analytics_jwt_placeholder
    ports:
      - "3004:3004"
    depends_on:
      web-analytics-service-db:
        condition: service_healthy
      web-analytics-service-redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fingermobile_network

volumes:
  web_analytics_service_db_data:
  web_analytics_service_redis_data:

networks:
  fingermobile_network:
    external: true # Assumes the main network is created by the master compose file
    name: fingermobile_network
