services:
  # API Gateway / Load Balancer
  api-gateway:
    build:
      context: ./apps/load-balancer
      dockerfile: Dockerfile
    container_name: api_gateway
    restart: unless-stopped
    ports:
      - "8000:80"
    networks:
      - fingermobile_network
    volumes:
      - ./apps/load-balancer/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      fingermobile-backend:
        condition: service_started

  # Core Frontend Main (React / TypeScript Web App)
  frontend-main:
    build:
      context: ./apps/frontend-main
      dockerfile: Dockerfile.prod
    container_name: fingermobile_frontend_main
    restart: unless-stopped
    ports:
      - "3000:80"
      - "3001:80"
    networks:
      - fingermobile_network
    depends_on:
      fingermobile-backend:
        condition: service_started

  # Core Platform Services
  fingermobile-backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: fingermobile_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=fingermobile-postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - REDIS_HOST=fingermobile-redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@fingermobile-postgres:5432/${POSTGRES_DB}
    ports:
      - "5000:3000" # Map backend port externally, adjust if needed
    depends_on:
      fingermobile-postgres:
        condition: service_healthy
      fingermobile-redis:
        condition: service_started
    volumes:
      - backend_uploads:/app/uploads # For persistent file uploads
    networks:
      - fingermobile_network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  #     depends_on:
  #       - fingermobile-backend
  #     networks:
  #       - fingermobile_network

  fingermobile-postgres:
    image: postgres:14-alpine
    container_name: fingermobile_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_MULTIPLE_DATABASES=fingermobile_identity_db,fingermobile_content_db,fingermobile_social_db,fingermobile_monetization_db,fingermobile_learning_db,fingermobile_gaming_db,prompts_db,guardian_db,sentient_db,meishe_db,nexusgnn_db,seshat_db,governance_db,fingermobile_business_db,fingermobile_comms
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - fingermobile_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  fingermobile-redis:
    image: redis:7-alpine
    container_name: fingermobile_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    env_file:
      - .env
    environment:
      - REDIS_REPLICATION_MODE=master
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fingermobile_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  fingermobile-pgadmin:
    image: dpage/pgadmin4
    container_name: fingermobile_pgadmin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
      - PGADMIN_CONFIG_SERVER_MODE=False
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./servers.json:/pgadmin4/servers.json # Optional: pre-configure server connections
    networks:
      - fingermobile_network
    depends_on:
      - fingermobile-postgres

  # Integrated Services (those with existing compose files, adapted)
  # Example: GameOn (adapted from its compose file)
  gameon-db:
    image: postgres:13
    container_name: gameon_db
    environment:
      POSTGRES_DB: gameon_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: gameon_db_password
    ports:
      - "54321:5432" # Use different external port to avoid conflict
    volumes:
      - gameon_db_data:/var/lib/postgresql/data
      # - ./Microservices 06102026/GameOn/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql # Path needs adjustment
    networks:
      - fingermobile_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  gameon-redis:
    image: redis:7-alpine
    container_name: gameon_redis
    command: redis-server --requirepass GameOn_redis_password
    ports:
      - "6380:6379" # Use different external port
    networks:
      - fingermobile_network
    restart: unless-stopped
