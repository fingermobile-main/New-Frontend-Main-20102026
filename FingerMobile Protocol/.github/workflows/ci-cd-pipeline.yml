name: FingerMobile CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:6.2-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: ./FingerMobile/backend/package-lock.json
        
    - name: Install backend dependencies
      run: |
        cd FingerMobile/backend
        npm ci
        
    - name: Run backend linting
      run: |
        cd FingerMobile/backend
        npm run lint
        
    - name: Run backend unit tests
      run: |
        cd FingerMobile/backend
        npm run test:unit
        
    - name: Run backend integration tests
      run: |
        cd FingerMobile/backend
        npm run test:integration
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        REDIS_URL: redis://localhost:6379

  test-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: ./frontend-main/package-lock.json
        
    - name: Install frontend dependencies
      run: |
        cd frontend-main
        npm ci
        
    - name: Run frontend linting
      run: |
        cd frontend-main
        npm run lint
        
    - name: Run frontend tests
      run: |
        cd frontend-main
        npm run test:ci

  test-mobile:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.13.0'
        channel: 'stable'
        
    - name: Install dependencies
      run: |
        cd FingerMobile/mobile_flutter
        flutter pub get
        
    - name: Run mobile tests
      run: |
        cd FingerMobile/mobile_flutter
        flutter test
        
    - name: Run mobile analyzer
      run: |
        cd FingerMobile/mobile_flutter
        flutter analyze

  build-and-deploy:
    needs: [test-backend, test-frontend, test-mobile]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Build and push backend image
      uses: docker/build-push-action@v4
      with:
        context: ./FingerMobile/backend
        push: true
        tags: fingermobile/backend:latest, fingermobile/backend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Build and push frontend image
      uses: docker/build-push-action@v4
      with:
        context: ./frontend-main
        push: true
        tags: fingermobile/frontend:latest, fingermobile/frontend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Build and push mobile image (for build artifacts)
      uses: docker/build-push-action@v4
      with:
        context: ./FingerMobile/mobile_flutter
        file: ./FingerMobile/mobile_flutter/Dockerfile.build
        push: true
        tags: fingermobile/mobile-builder:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Deploy to staging
      run: |
        # Deploy to staging environment
        echo "Deploying to staging..."
        # Add deployment commands here
        
    - name: Notify deployment
      run: |
        # Send deployment notification
        echo "Deployment to staging completed"