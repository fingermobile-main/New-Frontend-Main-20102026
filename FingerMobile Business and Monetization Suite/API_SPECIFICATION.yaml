openapi: 3.0.3
info:
  title: FingerMobile Business & Monetization Suite API
  description: |
    Comprehensive API for managing Seshat pages, monetization programs, 
    Guardian AI services, and KYC/KYB verification workflows.
    
    ## Authentication
    All endpoints require authentication via Bearer token in the Authorization header.
    
    ## Base URL
    ```
    http://localhost:3000/api
    ```
    
    ## Key Features
    - **Seshat Page Management**: Create and manage content creator pages
    - **Monetization Programs**: Eligibility checking and application submission
    - **Guardian AI Services**: Access key generation, coupon codes, name validation, biometric hashing
    - **KYC/KYB Verification**: Identity verification for individuals and businesses
    - **Revenue Tracking**: Real-time revenue estimation and payout management
    - **Admin Controls**: Approval workflows and configuration management
    
    ## Response Format
    All responses follow this structure:
    ```json
    {
      "success": true,
      "data": { ... },
      "message": "Optional message"
    }
    ```
    
    ## Error Handling
    Errors return HTTP status codes with descriptive messages:
    ```json
    {
      "success": false,
      "error": {
        "code": "VALIDATION_ERROR",
        "message": "Detailed error description"
      }
    }
    ```
  version: 1.0.0
  contact:
    name: FingerMobile API Support
    email: api-support@fingermobileprotocol.com
  license:
    name: Proprietary
    url: https://fingermobileprotocol.com/license

servers:
  - url: http://localhost:3000/api
    description: Development server
  - url: https://api.fingermobileprotocol.com/v1
    description: Production server

tags:
  - name: Health
    description: System health and status checks
  - name: Overview
    description: Dashboard overview and summary data
  - name: Seshat Pages
    description: Content creator page management
  - name: Programs & Eligibility
    description: Monetization program definitions and eligibility checking
  - name: Applications
    description: Monetization application submission
  - name: Revenue
    description: Revenue estimation, tracking, and payouts
  - name: Verification
    description: Business and payout account verification
  - name: Affiliate
    description: Affiliate partner tracking and commissions
  - name: Policy
    description: Platform policies and terms
  - name: Admin
    description: Administrative controls and monitoring
  - name: Webhooks
    description: Webhook event tracking
  - name: Guardian AI
    description: AI-powered security and validation services
  - name: KYC
    description: Individual identity verification (Know Your Customer)
  - name: KYB
    description: Business entity verification (Know Your Business)
  - name: Access Keys
    description: Access token management for followership and membership
  - name: Coupons
    description: Coupon code generation and redemption

paths:
  # ============================================================
  # HEALTH CHECK
  # ============================================================
  /health:
    get:
      tags:
        - Health
      summary: Health check endpoint
      description: Returns API health status and uptime information
      operationId: healthCheck
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
                  uptime:
                    type: number
                    description: Server uptime in seconds

  # ============================================================
  # OVERVIEW
  # ============================================================
  /overview:
    get:
      tags:
        - Overview
      summary: Get dashboard overview
      description: Retrieves comprehensive dashboard data including user info, metrics, eligibility, and revenue summary
      operationId: getOverview
      responses:
        '200':
          description: Dashboard overview retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================================
  # SESHAT PAGES
  # ============================================================
  /seshat:
    get:
      tags:
        - Seshat Pages
      summary: Get current Seshat page
      description: Retrieves the authenticated user's Seshat page details
      operationId: getSeshat
      responses:
        '200':
          description: Seshat page retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeshatPage'
        '404':
          description: No Seshat page found
          
    post:
      tags:
        - Seshat Pages
      summary: Create new Seshat page
      description: Creates a new Seshat page for the authenticated user
      operationId: createSeshat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - description
                - visibility
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 100
                  example: "My Creative Studio"
                description:
                  type: string
                  maxLength: 500
                  example: "Daily vlogs and tutorials"
                visibility:
                  type: string
                  enum: [public, private, unlisted]
                  example: public
      responses:
        '201':
          description: Seshat page created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeshatPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /seshat/{id}:
    put:
      tags:
        - Seshat Pages
      summary: Update Seshat page
      description: Updates an existing Seshat page
      operationId: updateSeshat
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Seshat page ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                visibility:
                  type: string
                  enum: [public, private, unlisted]
                billingPlan:
                  type: string
                  enum: [free, premium, enterprise]
      responses:
        '200':
          description: Seshat page updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeshatPage'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # PROGRAMS & ELIGIBILITY
  # ============================================================
  /programs:
    get:
      tags:
        - Programs & Eligibility
      summary: Get all monetization programs
      description: Returns list of all available monetization programs with requirements
      operationId: getPrograms
      responses:
        '200':
          description: List of programs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductDefinition'

  /eligibility:
    get:
      tags:
        - Programs & Eligibility
      summary: Check eligibility status
      description: Evaluates user eligibility for all monetization programs
      operationId: getEligibility
      responses:
        '200':
          description: Eligibility evaluation results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EligibilityResponse'

  # ============================================================
  # APPLICATIONS
  # ============================================================
  /applications:
    post:
      tags:
        - Applications
      summary: Submit monetization application
      description: Submits application for a specific monetization program
      operationId: submitApplication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - productKey
              properties:
                productKey:
                  type: string
                  enum: [ADS_REVENUE, GIFT_SUBSCRIPTIONS, MEMBERSHIPS, FOLLOWERSHIP, PREMIUM_CONTENT, AFFILIATE_MARKETING]
                  example: ADS_REVENUE
      responses:
        '201':
          description: Application submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonetizationApplication'
        '400':
          $ref: '#/components/responses/BadRequest'

  # ============================================================
  # REVENUE ESTIMATION
  # ============================================================
  /estimate:
    post:
      tags:
        - Revenue
      summary: Estimate potential revenue
      description: Calculates estimated earnings based on provided metrics
      operationId: estimateRevenue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstimateRequest'
      responses:
        '200':
          description: Revenue estimate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateResponse'

  # ============================================================
  # VERIFICATION
  # ============================================================
  /verification:
    get:
      tags:
        - Verification
      summary: Get verification status
      description: Returns business verification and payout account status
      operationId: getVerificationStatus
      responses:
        '200':
          description: Verification status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationStatus'
                
    put:
      tags:
        - Verification
      summary: Update business verification
      description: Submits or updates business verification information
      operationId: updateBusinessVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - legalName
                - registrationNumber
                - countryCode
              properties:
                legalName:
                  type: string
                  example: "Acme Corporation"
                registrationNumber:
                  type: string
                  example: "REG123456789"
                countryCode:
                  type: string
                  pattern: '^[A-Z]{2}$'
                  example: "US"
      responses:
        '200':
          description: Verification updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessVerification'

  /payout:
    put:
      tags:
        - Verification
      summary: Update payout account
      description: Configures bank account for receiving payouts
      operationId: updatePayoutAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - bankName
                - accountLast4
                - currency
              properties:
                bankName:
                  type: string
                  example: "Chase Bank"
                accountLast4:
                  type: string
                  pattern: '^[0-9]{4}$'
                  example: "1234"
                currency:
                  type: string
                  pattern: '^[A-Z]{3}$'
                  example: "USD"
      responses:
        '200':
          description: Payout account updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutAccount'

  # ============================================================
  # REVENUE & AFFILIATE
  # ============================================================
  /revenue:
    get:
      tags:
        - Revenue
      summary: Get revenue summary
      description: Returns revenue ledger, payouts, and account details
      operationId: getRevenueSummary
      responses:
        '200':
          description: Revenue summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueSummary'

  /affiliate:
    get:
      tags:
        - Affiliate
      summary: Get affiliate summary
      description: Returns affiliate partner events and commission overview
      operationId: getAffiliateSummary
      responses:
        '200':
          description: Affiliate summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliateSummary'

  # ============================================================
  # POLICY & ADMIN
  # ============================================================
  /policy:
    get:
      tags:
        - Policy
      summary: Get platform policy
      description: Returns current monetization policy version and sections
      operationId: getPolicy
      responses:
        '200':
          description: Policy document
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                  sections:
                    type: array
                    items:
                      type: object

  /admin:
    get:
      tags:
        - Admin
      summary: Get admin monitoring dashboard
      description: Returns admin configuration, audit logs, webhooks, and applications
      operationId: getAdminMonitoring
      responses:
        '200':
          description: Admin dashboard data
          content:
            application/json:
              schema:
                type: object
                properties:
                  config:
                    $ref: '#/components/schemas/PlatformConfig'
                  auditLogs:
                    type: array
                    items:
                      type: object
                  webhooks:
                    type: array
                    items:
                      type: object
                  applications:
                    type: array
                    items:
                      $ref: '#/components/schemas/MonetizationApplication'

  /config:
    put:
      tags:
        - Admin
      summary: Update platform configuration
      description: Updates platform-wide configuration settings (admin only)
      operationId: updateConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                minimumAge:
                  type: integer
                  minimum: 18
                  maximum: 25
                minimumPayoutThreshold:
                  type: number
                  minimum: 0
                seshatMonthlyFee:
                  type: number
                revenueSharePercentage:
                  type: number
                  minimum: 0
                  maximum: 100
                supportedCountries:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Configuration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformConfig'

  # ============================================================
  # WEBHOOKS
  # ============================================================
  /webhook:
    post:
      tags:
        - Webhooks
      summary: Track webhook event
      description: Records incoming webhook events for monitoring
      operationId: trackWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - eventType
              properties:
                eventType:
                  type: string
                  example: "payment.completed"
                payload:
                  type: object
      responses:
        '201':
          description: Webhook tracked
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  eventType:
                    type: string
                  status:
                    type: string
                  receivedAt:
                    type: string
                    format: date-time

  # ============================================================
  # GUARDIAN AI SERVICES
  # ============================================================
  /guardian/access-key:
    post:
      tags:
        - Guardian AI
      summary: Generate access key
      description: Generates a unique 16-character alphanumeric access token for followership or membership
      operationId: generateAccessKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - seshatPageId
                - keyType
              properties:
                seshatPageId:
                  type: string
                  example: "page_abc123"
                keyType:
                  type: string
                  enum: [FOLLOWERSHIP, MEMBERSHIP]
                  example: MEMBERSHIP
                expiryDays:
                  type: integer
                  minimum: 1
                  maximum: 365
                  default: 30
                  description: Number of days until expiration
      responses:
        '201':
          description: Access key generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessKey'
        '400':
          $ref: '#/components/responses/BadRequest'

  /guardian/coupon:
    post:
      tags:
        - Guardian AI
      summary: Generate coupon code
      description: Creates a unique coupon code with optional custom prefix
      operationId: generateCoupon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - seshatPageId
              properties:
                seshatPageId:
                  type: string
                  example: "page_abc123"
                prefix:
                  type: string
                  maxLength: 8
                  pattern: '^[A-Za-z0-9]+$'
                  example: "SUMMER"
                  description: Optional custom prefix (will be uppercased and sanitized)
      responses:
        '201':
          description: Coupon code generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coupon'

  /guardian/validate-name:
    post:
      tags:
        - Guardian AI
      summary: Validate business name
      description: Validates business or page name against 15+ grammar and compliance rules
      operationId: validateName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 100
                  example: "Creative Studios LLC"
      responses:
        '200':
          description: Name validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NameValidationResult'

  /guardian/biometric-hash:
    post:
      tags:
        - Guardian AI
      summary: Generate biometric hash
      description: Creates SHA-256 hash from face data for identity verification
      operationId: generateBiometricHash
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - faceData
              properties:
                faceData:
                  type: string
                  description: Base64-encoded face image data or raw string
                  example: "base64_encoded_image_data_here"
      responses:
        '200':
          description: Biometric hash generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  hash:
                    type: string
                    pattern: '^sha256:[a-f0-9]{64}$'
                    example: "sha256:a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2"
                  algorithm:
                    type: string
                    example: "SHA-256"

  # ============================================================
  # KYC VERIFICATION
  # ============================================================
  /kyc/submit:
    post:
      tags:
        - KYC
      summary: Submit KYC verification
      description: Submits individual identity verification documents and data
      operationId: submitKYC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - fullLegalName
                - dateOfBirth
                - biometricFaceHash
              properties:
                userId:
                  type: string
                  example: "user_123"
                fullLegalName:
                  type: string
                  example: "John Michael Smith"
                dateOfBirth:
                  type: string
                  format: date
                  example: "1990-05-15"
                nationality:
                  type: string
                  pattern: '^[A-Z]{2}$'
                  example: "US"
                idDocumentType:
                  type: string
                  enum: [PASSPORT, DRIVERS_LICENSE, NATIONAL_ID]
                  example: PASSPORT
                idDocumentNumber:
                  type: string
                  example: "AB1234567"
                biometricFaceHash:
                  type: string
                  pattern: '^sha256:[a-f0-9]{64}$'
                  example: "sha256:a1b2c3d4e5f6..."
                addressLine1:
                  type: string
                  example: "123 Main Street"
                city:
                  type: string
                  example: "New York"
                stateProvince:
                  type: string
                  example: "NY"
                postalCode:
                  type: string
                  example: "10001"
                countryCode:
                  type: string
                  pattern: '^[A-Z]{2}$'
                  example: "US"
      responses:
        '201':
          description: KYC submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KYCRecord'
        '400':
          description: Validation failed (e.g., under 22 years old)
          content:
            application/json:
              schema:
                $ref: '#/components/responses/BadRequest'

  /kyc/status/{userId}:
    get:
      tags:
        - KYC
      summary: Get KYC status
      description: Retrieves KYC verification status for a specific user
      operationId: getKYCStatus
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: User ID
      responses:
        '200':
          description: KYC status retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [PENDING, APPROVED, REJECTED, UNDER_REVIEW]
                  kycRecord:
                    $ref: '#/components/schemas/KYCRecord'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # KYB VERIFICATION
  # ============================================================
  /kyb/submit:
    post:
      tags:
        - KYB
      summary: Submit KYB verification
      description: Submits business entity verification documents and data
      operationId: submitKYB
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - businessLegalName
                - registrationNumber
                - countryCode
              properties:
                userId:
                  type: string
                  example: "user_456"
                businessLegalName:
                  type: string
                  example: "Acme Corporation LLC"
                registrationNumber:
                  type: string
                  example: "REG987654321"
                incorporationDate:
                  type: string
                  format: date
                  example: "2015-03-20"
                businessType:
                  type: string
                  enum: [LLC, CORPORATION, PARTNERSHIP, SOLE_PROPRIETORSHIP]
                  example: LLC
                taxId:
                  type: string
                  example: "TAX123456789"
                website:
                  type: string
                  format: uri
                  example: "https://acmecorp.com"
                industry:
                  type: string
                  example: "Technology"
                addressLine1:
                  type: string
                  example: "456 Business Ave"
                city:
                  type: string
                  example: "San Francisco"
                stateProvince:
                  type: string
                  example: "CA"
                postalCode:
                  type: string
                  example: "94102"
                countryCode:
                  type: string
                  pattern: '^[A-Z]{2}$'
                  example: "US"
      responses:
        '201':
          description: KYB submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KYBRecord'
        '400':
          $ref: '#/components/responses/BadRequest'

  /kyb/status/{userId}:
    get:
      tags:
        - KYB
      summary: Get KYB status
      description: Retrieves KYB verification status for a specific user
      operationId: getKYBStatus
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: User ID
      responses:
        '200':
          description: KYB status retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [PENDING, APPROVED, REJECTED, UNDER_REVIEW]
                  kybRecord:
                    $ref: '#/components/schemas/KYBRecord'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # ADMIN KYC/KYB MANAGEMENT
  # ============================================================
  /admin/kyc/approve:
    post:
      tags:
        - Admin
        - KYC
      summary: Approve KYC verification
      description: Admin approves a pending KYC verification (requires admin role)
      operationId: approveKYC
      security:
        - bearerAuth: []
        - adminRole: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - kycId
                - reviewerId
              properties:
                kycId:
                  type: string
                  example: "kyc_abc123"
                reviewerId:
                  type: string
                  example: "admin_789"
                notes:
                  type: string
                  maxLength: 500
                  example: "All documents verified and approved"
      responses:
        '200':
          description: KYC approved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "KYC record approved"
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/kyc/reject:
    post:
      tags:
        - Admin
        - KYC
      summary: Reject KYC verification
      description: Admin rejects a KYC verification with reason (requires admin role)
      operationId: rejectKYC
      security:
        - bearerAuth: []
        - adminRole: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - kycId
                - reviewerId
                - reason
              properties:
                kycId:
                  type: string
                  example: "kyc_abc123"
                reviewerId:
                  type: string
                  example: "admin_789"
                reason:
                  type: string
                  minLength: 10
                  maxLength: 500
                  example: "Identity document does not match photo"
      responses:
        '200':
          description: KYC rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string

  /admin/kyb/approve:
    post:
      tags:
        - Admin
        - KYB
      summary: Approve KYB verification
      description: Admin approves a pending KYB verification (requires admin role)
      operationId: approveKYB
      security:
        - bearerAuth: []
        - adminRole: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - kybId
                - reviewerId
              properties:
                kybId:
                  type: string
                reviewerId:
                  type: string
                notes:
                  type: string
      responses:
        '200':
          description: KYB approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string

  /admin/kyb/reject:
    post:
      tags:
        - Admin
        - KYB
      summary: Reject KYB verification
      description: Admin rejects a KYB verification with reason (requires admin role)
      operationId: rejectKYB
      security:
        - bearerAuth: []
        - adminRole: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - kybId
                - reviewerId
                - reason
              properties:
                kybId:
                  type: string
                reviewerId:
                  type: string
                reason:
                  type: string
      responses:
        '200':
          description: KYB rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string

  # ============================================================
  # ACCESS KEY MANAGEMENT
  # ============================================================
  /access-keys/{seshatPageId}:
    get:
      tags:
        - Access Keys
      summary: List access keys
      description: Retrieves all access keys for a specific Seshat page
      operationId: getAccessKeys
      parameters:
        - name: seshatPageId
          in: path
          required: true
          schema:
            type: string
          description: Seshat page ID
      responses:
        '200':
          description: List of access keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessKey'

  /access-keys:
    post:
      tags:
        - Access Keys
      summary: Create access key
      description: Creates and stores a new access key in database
      operationId: createAccessKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - seshatPageId
                - keyType
              properties:
                seshatPageId:
                  type: string
                keyType:
                  type: string
                  enum: [FOLLOWERSHIP, MEMBERSHIP]
                expiryDays:
                  type: integer
                  default: 30
      responses:
        '201':
          description: Access key created and stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessKey'

  /access-keys/{id}:
    delete:
      tags:
        - Access Keys
      summary: Revoke access key
      description: Deactivates an access key by setting isActive to false
      operationId: revokeAccessKey
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Access key ID
      responses:
        '200':
          description: Access key revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Access key revoked successfully"
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # COUPON MANAGEMENT
  # ============================================================
  /coupons/{seshatPageId}:
    get:
      tags:
        - Coupons
      summary: List coupons
      description: Retrieves all coupons for a specific Seshat page
      operationId: getCoupons
      parameters:
        - name: seshatPageId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of coupons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Coupon'

  /coupons:
    post:
      tags:
        - Coupons
      summary: Create coupon
      description: Creates and stores a new coupon in database
      operationId: createCoupon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - seshatPageId
              properties:
                seshatPageId:
                  type: string
                couponCode:
                  type: string
                  description: Custom coupon code (optional, auto-generated if omitted)
                prefix:
                  type: string
                  maxLength: 8
                description:
                  type: string
                discountPercentage:
                  type: number
                  minimum: 0
                  maximum: 100
                discountAmount:
                  type: number
                  minimum: 0
                minPurchaseAmount:
                  type: number
                  default: 0
                maxUses:
                  type: integer
                  minimum: 1
                  default: 100
                validUntil:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Coupon created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coupon'

  /coupons/{code}/redeem:
    post:
      tags:
        - Coupons
      summary: Redeem coupon
      description: Marks a coupon as redeemed by a user
      operationId: redeemCoupon
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: Coupon code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
              properties:
                userId:
                  type: string
                  example: "user_123"
      responses:
        '200':
          description: Coupon redeemed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  coupon:
                    $ref: '#/components/schemas/Coupon'
                  message:
                    type: string
                    example: "Coupon redeemed successfully"
        '400':
          description: Coupon already redeemed or expired
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from authentication endpoint

  schemas:
    # Core Models
    User:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        countryCode:
          type: string
        age:
          type: integer
        accountAgeDays:
          type: integer

    SeshatPage:
      type: object
      properties:
        id:
          type: string
        ownerUserId:
          type: string
        name:
          type: string
        description:
          type: string
        visibility:
          type: string
          enum: [public, private, unlisted]
        billingPlan:
          type: string
          enum: [free, premium, enterprise]
        followersCount:
          type: integer
        verifiedBusiness:
          type: boolean
        freeUntil:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    MonetizationMetrics:
      type: object
      properties:
        followers:
          type: integer
        watchMinutes60d:
          type: integer
        watchMinutes30d:
          type: integer
        postEngagement30d:
          type: integer
        returningViewers30d:
          type: integer
        uniqueViews30d:
          type: integer
        activeVideos:
          type: integer
        consecutiveFollowerDays:
          type: integer
        accountAgeDays:
          type: integer
        age:
          type: integer
        isEligibleCountry:
          type: boolean
        originalContentScore:
          type: integer
        policyViolations:
          type: integer
        giftPurchaseEligible:
          type: boolean
        verifiedBusiness:
          type: boolean
        verifiedPayout:
          type: boolean

    PlatformConfig:
      type: object
      properties:
        id:
          type: string
        minimumAge:
          type: integer
        minimumPayoutThreshold:
          type: number
        seshatMonthlyFee:
          type: number
        seshatYearlyFee:
          type: number
        revenueSharePercentage:
          type: number
        giftsCashValue:
          type: number
        supportedCountries:
          type: array
          items:
            type: string
        policyVersion:
          type: string
        affiliateBonusPercentage:
          type: number

    ProductDefinition:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: string
        requirements:
          type: array
          items:
            type: string
        benefits:
          type: array
          items:
            type: string

    EligibilityResult:
      type: object
      properties:
        productKey:
          type: string
        status:
          type: string
          enum: [eligible, ineligible, pending]
        passedRules:
          type: array
          items:
            type: string
        failedRules:
          type: array
          items:
            type: string
        nextActions:
          type: array
          items:
            type: string

    EligibilityResponse:
      type: object
      properties:
        universalStatus:
          type: string
          enum: [eligible, warning, blocked]
        products:
          type: array
          items:
            $ref: '#/components/schemas/EligibilityResult'
        metrics:
          $ref: '#/components/schemas/MonetizationMetrics'
        alerts:
          type: array
          items:
            type: string

    MonetizationApplication:
      type: object
      properties:
        id:
          type: string
        seshatPageId:
          type: string
        productKey:
          type: string
        status:
          type: string
          enum: [submitted, approved, rejected, pending_review]
        submittedAt:
          type: string
          format: date-time
        decisionNotes:
          type: string

    Revenue:
      type: object
      properties:
        availableBalance:
          type: number
        pendingPayouts:
          type: number
        monthRevenue:
          type: number
        thresholdRemaining:
          type: number

    OverviewResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        seshatPage:
          $ref: '#/components/schemas/SeshatPage'
        metrics:
          $ref: '#/components/schemas/MonetizationMetrics'
        config:
          $ref: '#/components/schemas/PlatformConfig'
        eligibility:
          type: object
          properties:
            universalStatus:
              type: string
            products:
              type: array
              items:
                $ref: '#/components/schemas/EligibilityResult'
        revenue:
          $ref: '#/components/schemas/Revenue'
        alerts:
          type: array
          items:
            type: string

    EstimateRequest:
      type: object
      required:
        - watchMinutes
        - followers
      properties:
        watchMinutes:
          type: integer
          minimum: 0
        followers:
          type: integer
          minimum: 0
        engagementRate:
          type: number
          minimum: 0
          maximum: 100

    EstimateResponse:
      type: object
      properties:
        estimatedMonthlyRevenue:
          type: number
        breakdown:
          type: object
          properties:
            adsRevenue:
              type: number
            giftsRevenue:
              type: number
            subscriptionsRevenue:
              type: number

    BusinessVerification:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        legalName:
          type: string
        registrationNumber:
          type: string
        countryCode:
          type: string
        reviewStatus:
          type: string
          enum: [pending, approved, rejected]
        submittedAt:
          type: string
          format: date-time

    PayoutAccount:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        bankName:
          type: string
        accountLast4:
          type: string
        currency:
          type: string
        verified:
          type: boolean
        createdAt:
          type: string
          format: date-time

    VerificationStatus:
      type: object
      properties:
        businessVerification:
          $ref: '#/components/schemas/BusinessVerification'
        payoutAccount:
          $ref: '#/components/schemas/PayoutAccount'
        policyAcknowledged:
          type: boolean

    RevenueLedgerEntry:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        amount:
          type: number
        netAmount:
          type: number
        source:
          type: string
        createdAt:
          type: string
          format: date-time

    Payout:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        amount:
          type: number
        status:
          type: string
          enum: [pending, processing, paid, failed]
        createdAt:
          type: string
          format: date-time

    RevenueSummary:
      type: object
      properties:
        ledger:
          type: array
          items:
            $ref: '#/components/schemas/RevenueLedgerEntry'
        payouts:
          type: array
          items:
            $ref: '#/components/schemas/Payout'
        payoutAccount:
          $ref: '#/components/schemas/PayoutAccount'
        config:
          $ref: '#/components/schemas/PlatformConfig'

    AffiliateEvent:
      type: object
      properties:
        id:
          type: string
        partnerId:
          type: string
        clicks:
          type: integer
        conversions:
          type: integer
        commissionAmount:
          type: number
        createdAt:
          type: string
          format: date-time

    AffiliateSummary:
      type: object
      properties:
        partners:
          type: array
          items:
            $ref: '#/components/schemas/AffiliateEvent'
        overview:
          type: object
          properties:
            totalClicks:
              type: integer
            totalConversions:
              type: integer
            totalCommission:
              type: number
            conversionRate:
              type: number

    # Guardian AI Models
    AccessKey:
      type: object
      properties:
        id:
          type: string
        seshatPageId:
          type: string
        keyToken:
          type: string
          pattern: '^[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}$'
          example: "A1B2-C3D4-E5F6-G7H8"
          description: 16-character alphanumeric token in XXXX-XXXX-XXXX-XXXX format
        keyType:
          type: string
          enum: [FOLLOWERSHIP, MEMBERSHIP]
        expiresAt:
          type: string
          format: date-time
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    Coupon:
      type: object
      properties:
        id:
          type: string
        seshatPageId:
          type: string
        couponCode:
          type: string
          pattern: '^[A-Z0-9]{1,12}-[A-Z0-9]{12}$'
          example: "TECH-A1B2C3D4E5F6"
        description:
          type: string
        discountPercentage:
          type: number
          minimum: 0
          maximum: 100
        discountAmount:
          type: number
          minimum: 0
        minPurchaseAmount:
          type: number
          default: 0
        maxUses:
          type: integer
          minimum: 1
        currentUses:
          type: integer
          default: 0
        isRedeemed:
          type: boolean
          default: false
        redeemedByUserId:
          type: string
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    NameValidationResult:
      type: object
      properties:
        isValid:
          type: boolean
        errors:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        sanitizedName:
          type: string
          description: Sanitized version of the input name

    # KYC/KYB Models
    KYCRecord:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        fullLegalName:
          type: string
        dateOfBirth:
          type: string
          format: date
        isAbove22Years:
          type: boolean
        nationality:
          type: string
        idDocumentType:
          type: string
          enum: [PASSPORT, DRIVERS_LICENSE, NATIONAL_ID]
        idDocumentNumber:
          type: string
        biometricFaceHash:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
        addressLine1:
          type: string
        addressLine2:
          type: string
        city:
          type: string
        stateProvince:
          type: string
        postalCode:
          type: string
        countryCode:
          type: string
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, UNDER_REVIEW]
        reviewedBy:
          type: array
          items:
            type: string
        reviewNotes:
          type: string
        submittedAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    KYBRecord:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        businessLegalName:
          type: string
        registrationNumber:
          type: string
        incorporationDate:
          type: string
          format: date
        businessType:
          type: string
          enum: [LLC, CORPORATION, PARTNERSHIP, SOLE_PROPRIETORSHIP]
        taxId:
          type: string
        website:
          type: string
          format: uri
        industry:
          type: string
        addressLine1:
          type: string
        addressLine2:
          type: string
        city:
          type: string
        stateProvince:
          type: string
        postalCode:
          type: string
        countryCode:
          type: string
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, UNDER_REVIEW]
        reviewedBy:
          type: array
          items:
            type: string
        reviewNotes:
          type: string
        submittedAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: object
                properties:
                  code:
                    type: string
                    example: "VALIDATION_ERROR"
                  message:
                    type: string
                    example: "Invalid input parameters"

    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: object
                properties:
                  code:
                    type: string
                    example: "UNAUTHORIZED"
                  message:
                    type: string
                    example: "Authentication token required"

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: object
                properties:
                  code:
                    type: string
                    example: "FORBIDDEN"
                  message:
                    type: string
                    example: "Admin role required for this operation"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: object
                properties:
                  code:
                    type: string
                    example: "NOT_FOUND"
                  message:
                    type: string
                    example: "Resource not found"
