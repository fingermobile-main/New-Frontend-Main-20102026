<!-- 
  FingerMobile Reusable Header Component
  Include at the top of main content area in all platform pages
  Version: 1.0
-->

<header class="fm-header text-white shadow-lg sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
            <div class="flex items-center flex-1">
                <!-- Burger Menu Button (Mobile Only) -->
                <button id="burger-menu-button" class="md:hidden inline-flex items-center justify-center p-2 rounded-md text-white hover:bg-white hover:bg-opacity-20 focus:outline-none mr-2" aria-label="Open menu">
                    <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
                
                <!-- Logo -->
                <div class="flex-shrink-0 flex items-center">
                    <img src="./assets/icons/logo.png" alt="FingerMobile" class="fm-logo">
                    <h1 class="ml-2 text-lg md:text-xl font-bold">FingerMobile</h1>
                </div>
                
                <!-- Desktop Navigation -->
                <nav class="hidden md:ml-6 md:flex md:space-x-8">
                    <a href="member_landing_page.html" class="text-white hover:bg-white hover:bg-opacity-20 px-3 py-2 rounded-md text-sm font-medium">Home</a>
                    <a href="forum_page.html" class="text-indigo-200 hover:bg-white hover:bg-opacity-20 px-3 py-2 rounded-md text-sm font-medium">Forum</a>
                    <a href="community_page_enhanced.html" class="text-indigo-200 hover:bg-white hover:bg-opacity-20 px-3 py-2 rounded-md text-sm font-medium">Community</a>
                    <a href="marketplace_page.html" class="text-indigo-200 hover:bg-white hover:bg-opacity-20 px-3 py-2 rounded-md text-sm font-medium">Marketplace</a>
                    <a href="wallet_page.html" class="text-indigo-200 hover:bg-white hover:bg-opacity-20 px-3 py-2 rounded-md text-sm font-medium">Wallet</a>
                </nav>
            </div>
            
            <div class="flex items-center space-x-2">
                <!-- Notifications -->
                <button class="p-2 rounded-full text-indigo-200 hover:text-white focus:outline-none" aria-label="Notifications">
                    <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                    </svg>
                </button>
                
                <!-- Profile -->
                <button class="flex text-sm rounded-full focus:outline-none" aria-label="Profile">
                    <img class="h-8 w-8 rounded-full border-2 border-white" src="https://randomuser.me/api/portraits/men/1.jpg" alt="Profile">
                </button>
            </div>
        </div>
    </div>
</header>
