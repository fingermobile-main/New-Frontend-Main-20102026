<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page - FingerMobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(to bottom right, #dbeafe, #e0e7ff);
        }
        
        .card {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            border-radius: 1rem;
        }
        
        .btn-social {
            transition: all 0.3s ease;
        }
        
        .btn-social:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        
        .input-field:focus {
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3);
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1 1 auto;
            border-bottom: 1px solid #d1d5db;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-blue-50 to-indigo-100">
    <div class="w-full max-w-md card bg-white">
        <div class="p-8 space-y-6">
            <div class="text-center space-y-2">
                <h1 class="text-2xl font-bold text-gray-900">Welcome Back</h1>
                <p class="text-gray-500">Enter your email and password to access your account</p>
            </div>
            
            <form id="loginForm">
                <div class="space-y-5">
                    <div class="space-y-2">
                        <label for="email" class="text-sm font-medium text-gray-700">Email Address</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                                <i class="fas fa-envelope"></i>
                            </div>
                            <input
                                id="email"
                                type="email"
                                placeholder="your@email.com"
                                class="input-field w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                required
                                value="test@fingermobile.com"
                            />
                        </div>
                    </div>
                    
                    <div class="space-y-2">
                        <label for="password" class="text-sm font-medium text-gray-700">Password</label>
                        <div class="relative">
                            <input
                                id="password"
                                type="password"
                                placeholder="••••••••"
                                class="input-field w-full pl-3 pr-10 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                required
                                value="TestPass123!"
                            />
                            <button
                                type="button"
                                class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600"
                                id="togglePassword"
                            >
                                <i class="far fa-eye"></i>
                            </button>
                        </div>
                    </div>
                </div>
                
                <button
                    type="submit"
                    class="w-full mt-6 py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg transition duration-300 ease-in-out transform hover:scale-[1.02]"
                    id="loginButton"
                >
                    Sign In
                </button>
            </form>
            
            <div class="divider flex items-center my-6 text-gray-400 text-sm">
                <span class="px-2 bg-white">Or continue with</span>
            </div>
            
            <div class="grid grid-cols-3 gap-3">
                <button
                    type="button"
                    class="btn-social flex items-center justify-center py-2 px-4 border border-gray-300 rounded-lg bg-white text-gray-700 hover:bg-gray-50"
                    onclick="handleSocialLogin('Google')"
                >
                    <i class="fab fa-google text-red-500 mr-2"></i>
                    Google
                </button>
                
                <button
                    type="button"
                    class="btn-social flex items-center justify-center py-2 px-4 border border-gray-300 rounded-lg bg-white text-gray-700 hover:bg-gray-50"
                    onclick="handleSocialLogin('Facebook')"
                >
                    <i class="fab fa-facebook text-blue-600 mr-2"></i>
                    Facebook
                </button>
                
                <button
                    type="button"
                    class="btn-social flex items-center justify-center py-2 px-4 border border-gray-300 rounded-lg bg-white text-gray-700 hover:bg-gray-50"
                    onclick="handleSocialLogin('Yahoo')"
                >
                    <i class="fab fa-yahoo text-purple-600 mr-2"></i>
                    Yahoo
                </button>
                
                <button
                    type="button"
                    class="btn-social flex items-center justify-center py-2 px-4 border border-gray-300 rounded-lg bg-white text-gray-700 hover:bg-gray-50"
                    onclick="handleSocialLogin('LinkedIn')"
                >
                    <i class="fab fa-linkedin text-blue-700 mr-2"></i>
                    LinkedIn
                </button>
                
                <button
                    type="button"
                    class="btn-social flex items-center justify-center py-2 px-4 border border-gray-300 rounded-lg bg-white text-gray-700 hover:bg-gray-50"
                    onclick="handleSocialLogin('Instagram')"
                >
                    <i class="fab fa-instagram text-pink-500 mr-2"></i>
                    Instagram
                </button>
                
                <button
                    type="button"
                    class="btn-social flex items-center justify-center py-2 px-4 border border-gray-300 rounded-lg bg-white text-gray-700 hover:bg-gray-50"
                    onclick="handleSocialLogin('TikTok')"
                >
                    <i class="fab fa-tiktok text-black mr-2"></i>
                    TikTok
                </button>
            </div>
        </div>
        
        <div class="px-8 pb-8 space-y-4">
            <button
                type="button"
                class="w-full py-2.5 text-center text-indigo-600 hover:text-indigo-800 text-sm font-medium"
                onclick="handlePhoneVerification()"
            >
                Verify with Phone
            </button>
            
            <div class="text-center text-sm text-gray-500">
                Don't have an account? 
                <a href="#" class="font-medium text-indigo-600 hover:text-indigo-500">
                    Sign up
                </a>
            </div>
            
            <div class="text-center text-sm text-gray-500">
                <a href="#" class="font-medium text-indigo-600 hover:text-indigo-500">
                    Forgot password?
                </a>
            </div>
        </div>
    </div>

    <script>
        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        // Handle form submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const submitBtn = this.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            
            // Show loading state
            submitBtn.textContent = 'Signing in...';
            submitBtn.disabled = true;
            
            // Make API call to backend
            fetch('http://localhost:3003/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email, password })
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(err => Promise.reject(err));
                }
                return response.json();
            })
            .then(data => {
                if (data.success && data.session_token) {
                    // Store session token
                    localStorage.setItem('session_token', data.session_token);
                    localStorage.setItem('member_id', data.member_id);
                    localStorage.setItem('user', JSON.stringify(data.member));
                    
                    alert('Login successful! Redirecting...');
                    
                    // Redirect to dashboard or home page
                    window.location.href = 'index.html';
                } else {
                    throw new Error(data.error || 'Login failed');
                }
            })
            .catch(error => {
                console.error('Login error:', error);
                alert('Login failed: ' + (error.message || error.error || 'Unknown error'));
            })
            .finally(() => {
                // Restore button state
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            });
        });

        // Handle social login
        function handleSocialLogin(provider) {
            alert(`Initiating login with ${provider}`);
            console.log(`Initiating login with ${provider}`);
        }

        // Handle phone verification
        function handlePhoneVerification() {
            alert('Phone verification requested');
        }
    </script>
</body>
</html>
