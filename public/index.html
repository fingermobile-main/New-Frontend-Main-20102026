<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FingerMobile Frontend</title>
    <link rel="icon" type="image/png" href="/assets/branding/fingermobile/ic_launcher(2).png" />
    <link rel="apple-touch-icon" href="/assets/branding/fingermobile/ic_launcher(2).png" />
    <style>
      /* Glassmorphic Crystal White Splash Screen Styles */
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 50% 40%, rgba(255, 255, 255, 0.98) 0%, rgba(245, 248, 252, 0.94) 50%, rgba(235, 240, 248, 0.9) 100%);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        opacity: 1;
        transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .splash-card {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.90) 0%, rgba(255, 255, 255, 0.75) 100%);
        border: 1px solid rgba(255, 255, 255, 0.8);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(255, 255, 255, 0.9) inset;
        border-radius: 28px;
        padding: 32px 36px;
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 380px;
        width: 90%;
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
      }

      .splash-graphic-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 20px;
        text-align: center;
      }

      .splash-graphic-header {
        font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
        font-size: 26px;
        font-weight: 500;
        color: #111827;
        margin-bottom: 6px;
        letter-spacing: -0.01em;
      }

      .splash-graphic-emblem {
        width: 120px;
        height: 120px;
        object-fit: contain;
        filter: drop-shadow(0 10px 20px rgba(255, 107, 0, 0.25));
        animation: pulse 2.5s infinite ease-in-out;
        margin: 4px 0;
      }

      .splash-graphic-tagline {
        font-family: 'Dancing Script', 'Caveat', 'Great Vibes', 'Brush Script MT', cursive;
        font-size: 19px;
        font-weight: 600;
        color: #1f2937;
        margin-top: 6px;
      }

      .splash-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 24px;
        font-weight: 900;
        color: #111827;
        margin: 0 0 2px 0;
        letter-spacing: -0.02em;
      }

      .splash-tagline {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 11px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #6b7280;
        margin-bottom: 20px;
        font-weight: 700;
      }

      .splash-progress-track {
        width: 100%;
        height: 6px;
        background: rgba(226, 232, 240, 0.7);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
      }

      .splash-progress-bar {
        height: 100%;
        width: 50%;
        background: linear-gradient(90deg, #ff6b00, #f59e0b);
        border-radius: 9999px;
        animation: loadingBar 1.8s infinite ease-in-out;
      }

      @keyframes loadingBar {
        0% { transform: translateX(-100%); width: 30%; }
        50% { transform: translateX(50%); width: 70%; }
        100% { transform: translateX(200%); width: 30%; }
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }

      /* Class to fade out the splash screen */
      .fade-out {
        opacity: 0 !important;
        pointer-events: none;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Glassmorphic Crystal White Splash Screen -->
    <div id="splash-screen">
      <div class="splash-card">
        <!-- Graphic Container -->
        <div class="splash-graphic-container">
          <div class="splash-graphic-header">FingerMobile</div>
          <img
            class="splash-graphic-emblem"
            src="/assets/branding/fingermobile/fingermobile_emblem.png"
            alt="FingerMobile Emblem"
            onerror="this.onerror=null; this.src='/assets/branding/fingermobile/FRONT copy.webp';"
          />
          <div class="splash-graphic-tagline">Join Us, Share your Moments!</div>
        </div>

        <!-- Directly Underneath That Graphic -->
        <h1 class="splash-title">FingerMobile<span style="color:#ff6b00">™</span></h1>
        <p class="splash-tagline">Protocol</p>

        <div class="splash-progress-track">
          <div class="splash-progress-bar"></div>
        </div>
      </div>
    </div>

    <!-- Main App Container -->
    <div id="root"></div>

    <script>
      (function() {
        var dismissed = false;
        function dismissSplash() {
          if (dismissed) return;
          dismissed = true;
          var splash = document.getElementById('splash-screen');
          if (splash) {
            splash.classList.add('fade-out');
            setTimeout(function() {
              splash.style.display = 'none';
            }, 500);
          }
        }

        // Splash screen delay set to 3.5 seconds (3500ms)
        // Allowing all security services and all other microservices to fully load in the background
        // As a one-time action on login/signin/signup/registration/forgotPassword/onboarding or platform reload/refresh
        setTimeout(dismissSplash, 3500);
      })();
    </script>
  </body>
</html>
