name: Deploy to Production

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run tests
      run: npm test
      
    - name: Security scan
      run: npm run security:audit

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build application
      run: npm run build
      env:
        NODE_ENV: production
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
        REDIS_URL: ${{ secrets.REDIS_URL }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
    - uses: actions/checkout@v3
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
    
    - name: Deploy to Elastic Beanstalk
      run: |
        EB_APP="fingermobile-protocol"
        EB_ENV="fingermobile-prod"
            
        # Create application version label
        VERSION_LABEL="v$(date +%Y%m%d%H%M%S)"
            
        # Zip the application
        zip -r ../app.zip .
            
        # Upload to S3
        aws s3 cp ../app.zip s3://${{ secrets.S3_BUCKET }}/$VERSION_LABEL-app.zip
            
        # Create application version
        aws elasticbeanstalk create-application-version \
          --application-name $EB_APP \
          --version-label $VERSION_LABEL \
          --source-bundle S3Bucket=${{ secrets.S3_BUCKET }},S3Key=$VERSION_LABEL-app.zip \
          --auto-create-application
            
        # Update environment to new version
        aws elasticbeanstalk update-environment \
          --environment-name $EB_ENV \
          --version-label $VERSION_LABEL
      env:
        NODE_ENV: production
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
        REDIS_URL: ${{ secrets.REDIS_URL }}