version: '3.8'

networks:
  fingermobile_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
  backend_uploads:
    driver: local
  gameon_db_data:
  fingerlux_db_data:
  flamingo_db_data:
  fingerwars_db_data:
  trends_db_data:
  gems_db_data:
  beatwaveng_db_data:
  beatwaveng_redis_data:
  camus_db_data:
  camus_redis_data:
  cmap_db_data:
  cmap_redis_data:
  dancia4tv_db_data:
  dancia4tv_redis_data:
  elearning_db_data:
  elearning_redis_data:
  hallmarks_db_data:
  hallmarks_redis_data:
  lendsqr_db_data:
  lendsqr_redis_data:
  luminagallery_db_data:
  luminagallery_redis_data:
  lushpressies_db_data:
  lushpressies_redis_data:
  marketplace_db_data:
  marketplace_redis_data:
  mii_db_data:
  mii_redis_data:
  monitoring_db_data:
  monitoring_redis_data:
  mylearning_db_data:
  mylearning_redis_data:
  mystorefront_db_data:
  mystorefront_redis_data:

services:
  # Core Platform Services
  fingermobile-backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: fingermobile_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_HOST=fingermobile-postgres
      - DB_PORT=5432
      - REDIS_HOST=fingermobile-redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@fingermobile-postgres:5432/${POSTGRES_DB}
    ports:
      - "3000:3000" # Map backend port externally, adjust if needed
    depends_on:
      fingermobile-postgres:
        condition: service_healthy
      fingermobile-redis:
        condition: service_started
    volumes:
      - backend_uploads:/app/uploads # For persistent file uploads
    networks:
      - fingermobile_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  fingermobile-frontend:
    build:
      context: ./apps/frontend-main
      dockerfile: Dockerfile
    container_name: fingermobile_frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000 # Adjust if frontend port changes
    ports:
      - "3001:3000" # Assuming frontend Dockerfile serves on port 3000, adjust accordingly
    depends_on:
      - fingermobile-backend
    networks:
      - fingermobile_network

  fingermobile-postgres:
    image: postgres:14-alpine
    container_name: fingermobile_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_MULTIPLE_DATABASES=fingermobile_identity_db,fingermobile_content_db,fingermobile_social_db,fingermobile_monetization_db,fingermobile_learning_db,fingermobile_gaming_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - ./apps/backend/database/migrations:/docker-entrypoint-initdb.d # Uncomment if initial schema is provided here
    networks:
      - fingermobile_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  fingermobile-redis:
    image: redis:7-alpine
    container_name: fingermobile_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    env_file:
      - .env
    environment:
      - REDIS_REPLICATION_MODE=master
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fingermobile_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  fingermobile-pgadmin:
    image: dpage/pgadmin4
    container_name: fingermobile_pgadmin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
      - PGADMIN_CONFIG_SERVER_MODE=False
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./servers.json:/pgadmin4/servers.json # Optional: pre-configure server connections
    networks:
      - fingermobile_network
    depends_on:
      - fingermobile-postgres

  # Integrated Services (those with existing compose files, adapted)
  # Example: GameOn (adapted from its compose file)
  gameon-db:
    image: postgres:13
    container_name: gameon_db
    environment:
      POSTGRES_DB: gameon_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: gameon_db_password
    ports:
      - "54321:5432" # Use different external port to avoid conflict
    volumes:
      - gameon_db_data:/var/lib/postgresql/data
      # - ./apps/GameOn/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql # Path needs adjustment
    networks:
      - fingermobile_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  gameon-redis:
    image: redis:7-alpine
    container_name: gameon_redis
    command: redis-server --requirepass GameOn_redis_password
    ports:
      - "6380:6379" # Use different external port
    networks:
      - fingermobile_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a gameon_redis_password ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  gameon-backend:
    build:
      context: ./apps/GameOn/backend
      dockerfile: Dockerfile
    container_name: gameon_backend
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_HOST=gameon-db
      - DB_PORT=5432
      - DB_NAME=gameon_db
      - DB_USER=postgres
      - DB_PASSWORD=gameon_db_password
      - DATABASE_URL=postgresql://postgres:gameon_db_password@gameon-db:5432/gameon_db
      - REDIS_HOST=gameon-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=GameOn_redis_password
      - JWT_SECRET=GameOn_jwt_secret_key_2026_production
      - JWT_EXPIRES_IN=7d
    ports:
      - "30011:3001" # Use different external port
    depends_on:
      gameon-db:
        condition: service_healthy
      gameon-redis:
        condition: service_healthy
    networks:
      - fingermobile_network
    restart: unless-stopped

  # Example: FingerLux (adapted from its compose file)
  fingerlux-backend:
    build:
      context: ./apps/FingerLux/backend
      dockerfile: Dockerfile
    container_name: fingerlux_backend
    ports:
      - "5006:5000"
    environment:
