      - POSTGRES_PORT=5432
      - POSTGRES_USER=fingerlux_user
      - POSTGRES_PASSWORD=fingerlux_pass
      - POSTGRES_DB=fingerlux_db
      - REDIS_HOST=fingerlux-redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://:fingermobile_redis_secure_password_2026_min32chars@fingerlux-redis:6379
    networks:
      - fingermobile_network
    depends_on:
      - fingerlux-db
      - fingerlux-redis
    restart: unless-stopped
    # healthcheck: # Add if available in source

  fingerlux-db:
    image: postgres:13-alpine
    container_name: fingerlux_db
