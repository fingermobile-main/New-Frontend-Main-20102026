# ==========================================
# Prometheus Configuration for FingerMobile Staging
# Date: June 11, 2026
# ==========================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules once and periodically evaluate them
rule_files: []

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter (System Metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # API Server Metrics
  - job_name: 'api-server'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:3000']
    scrape_interval: 10s

  # WebSocket Server Metrics
  - job_name: 'websocket-server'
    metrics_path: '/ws/metrics'
    static_configs:
      - targets: ['websocket:3001']

  # PostgreSQL Database Metrics
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Redis Metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # NGINX Metrics
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
