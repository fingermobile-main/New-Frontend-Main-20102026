services:
  # Core Platform Services
  fingermobile-backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: fingermobile_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_HOST=fingermobile-postgres
      - DB_PORT=5432
      - REDIS_HOST=fingermobile-redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@fingermobile-postgres:5432/${POSTGRES_DB:-fingermobile}
    ports:
      - "3000:3000"
    depends_on:
      fingermobile-postgres:
        condition: service_healthy
      fingermobile-redis:
        condition: service_started
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - fingermobile_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  fingermobile-frontend:
    build:
      context: ./apps/frontend-main
      dockerfile: Dockerfile
    container_name: fingermobile_frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    ports:
      - "3081:3000"
    depends_on:
      - fingermobile-backend
    networks:
      - fingermobile_network

  fingermobile-postgres:
    image: postgres:14-alpine
    container_name: fingermobile_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-fingermobile}
      - POSTGRES_MULTIPLE_DATABASES=fingermobile_identity_db,fingermobile_content_db,fingermobile_social_db,fingermobile_monetization_db,fingermobile_learning_db,fingermobile_gaming_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fingermobile_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fingermobile}"]
      interval: 10s
      timeout: 5s
      retries: 5

  fingermobile-redis:
    image: redis:7-alpine
    container_name: fingermobile_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fingermobile_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  fingermobile-pgadmin:
    image: dpage/pgadmin4
    container_name: fingermobile_pgadmin
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-admin}
      - PGADMIN_CONFIG_SERVER_MODE=False
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./servers.json:/pgadmin4/servers.json
    networks:
      - fingermobile_network
    depends_on:
      - fingermobile-postgres

