Docker-Compose up

Several critical issues break functionality, create port conflicts, and cause configuration failures in this Compose file.
Critical Errors & Issues Identified
⚬ YAML Syntax Corruption (Broken Blocks): The web-analytics-service-backend section was duplicated mid-file, leaving dangling, orphaned keys (- dancia4tv_db_data...) directly under networks:, causing Docker to fail parsing.
⚬ Duplicate Services & Port Conflicts: ⚬ web-analytics-service-backend and trends service groups were duplicated entirely. ⚬ Host port 3001 was bound by 13 different services (supervi-web-backend, beatwaveng-backend, fingerlux-backend, dancia4tv-backend, elearning-backend, fingerwars-backend, flamingo-backend, hallmarks-backend, mii-backend, mystorefront-backend, nysc-backend, ownit-backend, permanence-backend, photocredits-backend, storefront-backend, tms-backend, and trends-backend). ⚬ Host port 5443, 5444, 5445, and 6490 were reused across multiple database/Redis containers.
⚬ Database & Redis Variable Mismatches: ⚬ fingermobile-postgres called health checks on ${POSTGRES_USER} and ${POSTGRES_DB}, but those were never defined under its environment: block. ⚬ camus-backend used DB_HOST=camus-db and DB_PASSWORD=${DB_PASSWORD}, but the database container was missing a matching healthcheck user reference and fallback. ⚬ Several Redis services lacked appropriate volume mounts or used invalid healthcheck flags.
Key Optimizations Applied
1. Port Mapping Consolidation: Assigned unique, sequential host ports to all backend services (3001–3023) and databases (5432–5458) to eliminate host binding crashes.
2. Environment Variable Fallbacks: Standardized default variables (POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB) to guarantee containers initialize cleanly without strict .env file requirements.
3. Deduplication: Removed copy-pasted blocks for web-analytics-service and trends.



